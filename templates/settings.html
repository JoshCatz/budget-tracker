{% extends "base.html" %}
{% block title %}Settings — Tip Tracker{% endblock %}

{% block content %}
<p class="font-mono text-xs text-accent tracking-widest uppercase mb-2"># settings</p>
<h1 class="font-display text-3xl text-white mb-10">Settings & Balances</h1>

<form method="POST" class="space-y-10" onsubmit="return checkLoggedIn();">

  <div>
    <p class="font-mono text-xs text-muted uppercase tracking-wider mb-4">Fixed Deductions</p>
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="font-mono text-xs text-gray-400 uppercase tracking-wider block mb-2">Checking Buffer Target</label>
        <input type="number" step="0.01" name="checking_buffer" value="{{ settings.checking_buffer }}"
               class="w-full bg-transparent border border-line rounded-lg px-4 py-3 text-white focus:border-accent focus:outline-none">
      </div>
      <div>
        <label class="font-mono text-xs text-gray-400 uppercase tracking-wider block mb-2">Debt Payment Target</label>
        <input type="number" step="0.01" name="debt_payment_amount" value="{{ settings.debt_payment_amount }}"
               class="w-full bg-transparent border border-line rounded-lg px-4 py-3 text-white focus:border-accent focus:outline-none">
      </div>
    </div>
  </div>

  <button type="submit" class="px-5 py-3 bg-accent text-black text-sm font-semibold rounded-lg hover:bg-white transition-colors">
    Save settings
  </button>
</form>
{% endblock %}
