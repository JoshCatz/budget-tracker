<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Tip Tracker{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const isLoggedIn = {{ 'true' if current_user.is_authenticated else 'false' }};
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#000000',
          line: '#1f1f1f',
          accent: '#5FB3B3',
          muted: '#8a8a8a',
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      },
    },
  }
  function checkLoggedIn() {
    if (!isLoggedIn) {
      alert("This action requires sign in.");
      return false; // stops the form from submitting at all
    }
    return true; // allows it through normally
  }
</script>
</head>
<body class="bg-bg text-gray-200 font-body min-h-screen">

  <nav class="border-b border-line">
    <div class="max-w-4xl mx-auto px-6 py-5 flex items-center justify-between">
      <a href="{{ url_for('dashboard.read_dashboard') }}" class="font-mono text-sm text-accent tracking-widest uppercase">
        &lt;tip_tracker /&gt;
      </a>
      <div class="flex gap-6 font-mono text-sm">
        <a href="{{ url_for('dashboard.read_dashboard') }}" class="text-gray-400 hover:text-accent transition-colors">dashboard</a>
        <a href="{{ url_for('shifts.read_shift') }}" class="text-gray-400 hover:text-accent transition-colors">shifts</a>
        <a href="{{ url_for('settings.settings') }}" class="text-gray-400 hover:text-accent transition-colors">settings</a>
        {% if current_user.is_authenticated %}
          <form method="POST" action="{{ url_for('login.logout') }}" class="inline">
            <button type="submit" class="text-gray-400 hover:text-accent transition-colors font-mono text-sm">logout</button>
          </form>
        {% else %}
          <a href="{{ url_for('login.login') }}" class="text-gray-400 hover:text-accent transition-colors font-mono text-sm">sign in</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-12">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
