<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Tip Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#000000',
          line: '#1f1f1f',
          accent: '#5FB3B3',
          muted: '#8a8a8a',
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-gray-200 font-body min-h-screen flex items-center justify-center px-6">

  <div class="w-full max-w-sm">
    <p class="font-mono text-xs text-accent tracking-widest uppercase mb-2 text-center">&lt;tip_tracker /&gt;</p>
    <h1 class="font-display text-2xl text-white mb-8 text-center">Sign in</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-6 border border-red-900 bg-red-950/40 text-red-300 text-sm rounded-lg px-4 py-3">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="border border-line rounded-lg p-6 space-y-5">
      <div>
        <label class="font-mono text-xs text-gray-400 uppercase tracking-wider block mb-2">Username</label>
        <input type="text" name="username" required autofocus
               class="w-full bg-transparent border border-line rounded-lg px-4 py-3 text-white focus:border-accent focus:outline-none">
      </div>

      <div>
        <label class="font-mono text-xs text-gray-400 uppercase tracking-wider block mb-2">Password</label>
        <input type="password" name="password" required
               class="w-full bg-transparent border border-line rounded-lg px-4 py-3 text-white focus:border-accent focus:outline-none">
      </div>

      <button type="submit" class="w-full px-4 py-3 bg-accent text-black text-sm font-semibold rounded-lg hover:bg-white transition-colors">
        Sign in
      </button>
      <a href="{{ url_for('dashboard.read_dashboard') }}"
        class="block w-full text-center px-4 py-3 border border-line text-sm font-semibold rounded-lg text-gray-300 hover:border-accent hover:text-accent transition-colors mt-3">
        Continue without Sign In
      </a>
    </form>
  </div>

</body>
</html>
